{% extends "base.html" %}

{% block title %}
Start Interview
{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white">

                    <h3>Select Interview</h3>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}

                        <div class="mb-3">

                            {{ form.role.label }}

                            {{ form.role }}

                        </div>

                        <div class="mb-3">

                            {{ form.experience.label }}

                            {{ form.experience }}

                        </div>

                        <button
                            class="btn btn-success w-100">

                            Generate AI Questions

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
