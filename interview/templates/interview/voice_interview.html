{% extends "base.html" %}
{% load static %}

{% block title %}
Voice Interview
{% endblock %}

{% block content %}

<div class="container mt-5">

    <!-- Header -->

    <div class="text-center">

        <img
            src="{% static 'images/robot.png' %}"
            width="170"
            id="robot"
            alt="AI Interviewer">

        <h2 class="mt-3">

            Interview by AI

        </h2>

        <p class="text-muted">

            Your Personal AI Interviewer

        </p>

    </div>


    <!-- Interview Card -->

    <div class="card shadow-lg mt-4">

        <div class="card-body p-4">

            <!-- Hidden Values -->

            <input
                type="hidden"
                id="firstQuestion"
                value="{{ first_question }}">

            <input
                type="hidden"
                id="interviewId"
                value="{{ interview.id }}">


            <!-- AI Status -->

            <div class="text-center">

                <h5
                    id="status"
                    class="text-primary fw-bold">

                    🟢 Ready

                </h5>

            </div>

            <hr>


            <!-- AI Question -->

            <h5 class="text-primary">

                🤖 AI Interviewer

            </h5>

            <div
                id="aiQuestion"
                class="border rounded p-3 bg-light fs-5"
                style="min-height:100px;">

                Click <strong>Start Interview</strong> to begin.

            </div>

            <hr>

            <!-- =========================
CODE EDITOR
========================= -->

<div id="codingSection" style="display:none; margin-top:20px;">

    <h4>Coding Question</h4>

    <textarea
        id="codeEditor"
        rows="15"
        cols="80"
        placeholder="Write your code here..."
    ></textarea>

    <br><br>

    <button id="submitCodeButton">
        Submit Code
    </button>

</div>


            <!-- User Answer -->

            <h5 class="text-success">

                🎤 Your Answer

            </h5>

            <div
                id="userSpeech"
                class="border rounded p-3"
                style="min-height:100px;">

                Waiting...

            </div>

        </div>

    </div>


    <!-- Question Counter -->

    <div class="text-center mt-3">

        <h5
            id="questionCounter">

            Question 1 / 15

        </h5>

    </div>


    <!-- Start & Skip Buttons -->

<div class="text-center mt-4">

    <button
        class="btn btn-success btn-lg px-5"
        id="startButton">

        🎤 Start Interview

    </button>

    <button
        class="btn btn-warning btn-lg ms-2"
        id="skipButton">

        ⏭️ Skip Question

    </button>

</div>

<script src="{% static 'interview/js/interview.js' %}"></script>

{% endblock %}
