{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:500px;">

    <h2>Login</h2>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button class="btn btn-success w-100">
            Login
        </button>

    </form>

    <!-- Forgot Password -->

    <div class="text-center mt-3">

        <a href="{% url 'password_reset' %}">
            Forgot Password?
        </a>

    </div>

    <div class="text-center mt-2">

        Don't have an account?

        <a href="{% url 'register' %}">
            Register
        </a>

    </div>

</div>

{% endblock %}
