{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:500px">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center">
                Forgot Password
            </h2>

            <p class="text-muted">
                Enter your registered email address.
            </p>

            <form method="post">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary w-100">
                    Send Reset Link
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
